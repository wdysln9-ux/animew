name: Build AnimeW ARM64 APK

on:
  push:
    branches:
      - main
      - feat/cinematic-ambient-lighting
    paths-ignore:
      - "preview/**"
      - ".github/workflows/preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show tool versions
        run: |
          flutter --version
          dart --version
      - name: Install dependencies
        run: flutter pub get
      - name: Configure persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
            printf 'storePassword=%s\\nkeyPassword=%s\\nkeyAlias=%s\\nstoreFile=release-keystore.jks\\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          else
            echo "No persistent signing secrets configured; APK will use runner debug signing."
          fi
      - name: Prepare isolated Gradle environment
        run: |
          rm -rf "${RUNNER_TEMP}/animew-gradle-home"
          mkdir -p "${RUNNER_TEMP}/animew-gradle-home"
      - name: Build arm64 release APK
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/animew-gradle-home
          GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false
        run: flutter build apk --release --target-platform android-arm64
      - name: Name AnimeW APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AnimeW-arm64-v8a.apk
      - name: Publish AnimeW APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: animew-build-${{ github.run_number }}
          name: AnimeW build ${{ github.run_number }}
          body: Automatic ARM64 APK build from commit ${{ github.sha }}.
          prerelease: true
          make_latest: false
          files: build/app/outputs/flutter-apk/AnimeW-arm64-v8a.apk
          fail_on_unmatched_files: true

name: Build AnimeW ARM64 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the APK as an in-app update release after final approval
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: animew-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up compatible Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Free disk space on GitHub runner
        uses: jlumbroso/free-disk-space@v2
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          preinstalled-runtimes: false
          swap-storage: false

      - name: Check available disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          available_gib=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
          echo "Available disk space: ${available_gib} GiB"
          if [ "$available_gib" -lt 8 ]; then
            echo "Not enough free disk space for the Android DEX build (need at least 8 GiB)."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android build components before Gradle
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_SDK/cmdline-tools"
            find "$ANDROID_SDK" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          echo "Using Android SDK: $ANDROID_SDK"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358" "cmake;3.22.1"
          df -h /

      - name: Show tool versions
        shell: bash
        run: |
          flutter --version
          dart --version
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          "$SDKMANAGER" --list_installed | grep -E 'ndk;|cmake;' || true

      - name: Install dependencies
        run: flutter pub get

      - name: Add retries for transient libmpv download failures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          candidates = list((Path.home() / ".pub-cache/git").glob(
              "media-kit-*/libs/android/media_kit_libs_android_video/android/build.gradle"
          ))
          if len(candidates) != 1:
              raise SystemExit(f"Expected one media-kit Android build.gradle, found {len(candidates)}")

          path = candidates[0]
          source = path.read_text()
          old = """                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }"""
          new = """                boolean downloaded = false
                for (int attempt = 1; attempt <= 5 && !downloaded; attempt++) {
                    try {
                        def connection = new URL(fileInfo.url).openConnection()
                        connection.setConnectTimeout(30000)
                        connection.setReadTimeout(120000)
                        connection.getInputStream().withCloseable { input ->
                            destFile.withOutputStream { os -> os << input }
                        }
                        downloaded = true
                    } catch (Exception error) {
                        destFile.delete()
                        if (attempt == 5) {
                            throw new GradleException("Download failed after 5 attempts: ${fileInfo.url}", error)
                        }
                        println "Download attempt ${attempt}/5 failed: ${error.message}. Retrying..."
                        sleep(5000L * attempt)
                    }
                }"""
          if old not in source:
              if "Download failed after 5 attempts" in source:
                  print("Retry patch already present.")
              else:
                  raise SystemExit("Expected libmpv download block not found; no patch applied.")
          else:
              path.write_text(source.replace(old, new, 1))
              print(f"Added download retries to {path}")
          PY

      - name: Configure persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
            printf 'storePassword=%s\\nkeyPassword=%s\\nkeyAlias=%s\\nstoreFile=release-keystore.jks\\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          else
            echo "No persistent signing secrets configured; APK will use runner debug signing."
          fi

      - name: Build arm64 release APK
        env:
          BUILD_NAME: 1.0.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$BUILD_NAME" \
            --build-number="$((30000 + BUILD_NUMBER))"

      - name: Name versioned APK
        env:
          APK_NAME: AnimeW-v1.0.${{ github.run_number }}-arm64-v8a.apk
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$APK_NAME"
          echo "APK_PATH=build/app/outputs/flutter-apk/$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload ARM64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeW-v1.0.${{ github.run_number }}-arm64-v8a
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish in-app update release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AnimeW 1.0.${{ github.run_number }}
          body: |
            Automatic ARM64 build from commit ${{ github.sha }}.

            This pre-release was published after the Android APK build completed successfully.
          prerelease: true
          make_latest: false
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true

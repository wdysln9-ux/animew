name: Build AnimeW ARM64 APK
# Feature branches run the same arm64 release build for validation.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Free space used by unrelated preinstalled tools on GitHub's runner.
      # Keep Android platform/build-tools, NDK, and CMake required by Flutter plugins.
      - name: Free runner disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/sources \
            /usr/local/lib/android/sdk/skins
          sudo apt-get clean
          sudo docker system prune -af || true
          echo "Disk space after cleanup:"
          df -h /

      # Reuse Android native toolchains and Gradle dependencies between runs.
      # The first successful cache save prevents downloading/unpacking the NDK again.
      - name: Cache Android toolchain and Gradle
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle', 'android/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            android-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          df -h /

      - name: Install dependencies
        run: flutter pub get

      # Configure these four GitHub Actions secrets once to keep the APK
      # signature stable across builds, so Android can update in place.
      - name: Configure persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
            printf 'storePassword=%s\\nkeyPassword=%s\\nkeyAlias=%s\\nstoreFile=release-keystore.jks\\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          else
            echo "No persistent signing secrets configured; APK will use runner debug signing."
          fi

      - name: Build arm64 release APK
        env:
          BUILD_NAME: 1.0.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
          # Disable Gradle's file-system watcher on this ephemeral runner.
          GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$BUILD_NAME" \
            --build-number="$((30000 + BUILD_NUMBER))"
          df -h /

      # Give the APK a versioned filename. GitHub Release stores this as a
      # raw .apk asset; Actions artifacts are ZIP-wrapped, so do not upload it
      # through upload-artifact.
      - name: Name versioned APK
        env:
          APK_NAME: AnimeW-v1.0.${{ github.run_number }}-arm64-v8a.apk
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$APK_NAME"
          echo "APK_PATH=build/app/outputs/flutter-apk/$APK_NAME" >> "$GITHUB_ENV"

      # Publish the raw APK as a versioned release asset for direct download
      # and the in-app updater. Keep the stable package ID and signing key.
      - name: Publish in-app update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AnimeW 1.0.${{ github.run_number }}
          body: |
            Automatic ARM64 build from commit ${{ github.sha }}.

            This pre-release was published after the Android APK build completed successfully.
          prerelease: true
          make_latest: false
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true

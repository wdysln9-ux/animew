name: Import Zangetsu base into AnimeW

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    if: "!contains(github.event.head_commit.message, 'Import customized Zangetsu source as AnimeW base')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AnimeW
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout customized Zangetsu snapshot
        uses: actions/checkout@v4
        with:
          repository: wdysln9-ux/Zangetsu
          ref: 0e8bb861eb190176c1ad351dc9dcb9b4f2d668c7
          path: source

      - name: Copy complete source tree
        run: |
          rsync -a --delete --exclude='/.git/' --exclude='/source/' source/ ./
          rm -rf source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import customized Zangetsu source as AnimeW base"
          git push origin HEAD:main
